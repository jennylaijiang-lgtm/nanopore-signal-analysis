[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanopore-signal-analysis"
version = "0.1.0"
description = "Selected Python implementations for nanopore signal processing, alignment and consensus analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.59", "pandas>=2.0"]

[project.optional-dependencies]
research = ["h5py>=3.9", "matplotlib>=3.7"]
dev = ["pytest>=8", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["cowler", "scripts", "examples"]

[tool.pytest.ini_options]
testpaths = ["cowler/tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["examples", "cowler/io/lut.py", "cowler/io/normalize.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
